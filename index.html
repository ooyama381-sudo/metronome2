<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8カウント メトロノーム</title>
<style>
  :root{
    --bg-0:#050507;
    --bg-1:#0d0d16;
    --accent-1:#ff2e63;   /* 1拍目（頭） */
    --accent-1-dim: #5c1329;
    --accent-2:#08d9d6;   /* 通常拍 */
    --accent-2-dim:#0a4a49;
    --text-0:#f2f2f5;
    --text-dim:#6c6c7c;
    --ring-size: min(72vmin, 340px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:
      radial-gradient(ellipse at 50% 20%, var(--bg-1) 0%, var(--bg-0) 65%);
    color:var(--text-0);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
    overflow-x:hidden;
  }

  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 32px 20px 40px;
    gap: 34px;
  }

  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ---- リング & カウント表示 ---- */
  .stage{
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid #1c1c28;
  }

  .dot{
    position:absolute;
    top:50%; left:50%;
    width: 14px; height:14px;
    margin: -7px 0 0 -7px;
    border-radius:50%;
    background: var(--accent-2-dim);
    transition: background .12s ease, transform .12s ease, box-shadow .12s ease;
  }

  .dot.beat1{
    width:16px; height:16px;
    margin: -8px 0 0 -8px;
    border-radius:3px;
    background: var(--accent-1-dim);
    transform: translate(var(--tx), var(--ty)) rotate(45deg);
  }
  .dot:not(.beat1){
    transform: translate(var(--tx), var(--ty));
  }

  .dot.active:not(.beat1){
    background: var(--accent-2);
    box-shadow: 0 0 14px 2px var(--accent-2);
    transform: translate(var(--tx), var(--ty)) scale(1.35);
  }
  .dot.beat1.active{
    background: var(--accent-1);
    box-shadow: 0 0 18px 3px var(--accent-1);
    transform: translate(var(--tx), var(--ty)) rotate(45deg) scale(1.35);
  }

  .center{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }

  .count{
    font-size: clamp(88px, 30vmin, 148px);
    font-weight: 800;
    line-height:1;
    font-variant-numeric: tabular-nums;
    color: var(--accent-2);
    letter-spacing: -0.02em;
    transition: color .08s ease;
  }
  .count.beat1{
    color: var(--accent-1);
  }
  .count.pulse{
    animation: pulse 0.18s ease-out;
  }
  @media (prefers-reduced-motion: reduce){
    .count.pulse{ animation:none; }
    .dot{ transition:none; }
  }
  @keyframes pulse{
    0%{ transform: scale(1.16); }
    100%{ transform: scale(1); }
  }

  .of-eight{
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ---- コントロール ---- */
  .controls{
    width: min(360px, 88vw);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 22px;
  }

  .bpm-row{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .bpm-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:0.05em;
  }
  .bpm-label strong{
    color:var(--text-0);
    font-size:20px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:2px;
    background: linear-gradient(to right, var(--accent-2) 0%, var(--accent-2) var(--pct,50%), #1c1c28 var(--pct,50%), #1c1c28 100%);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--text-0);
    border: 3px solid var(--accent-2);
    cursor:pointer;
    transition: transform .1s ease;
  }
  input[type="range"]::-webkit-slider-thumb:active{ transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb{
    width:20px; height:20px;
    border-radius:50%;
    background: var(--text-0);
    border: 3px solid var(--accent-2);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-track{
    height:4px;
    border-radius:2px;
    background:#1c1c28;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb{
    outline: 2px solid var(--text-0);
    outline-offset: 2px;
  }

  .play-btn{
    width: 84px; height: 84px;
    border-radius:50%;
    border: none;
    background: var(--text-0);
    color: var(--bg-0);
    font-size: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .play-btn:hover{ transform: scale(1.04); }
  .play-btn:active{ transform: scale(0.96); }
  .play-btn:focus-visible{
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
  }
  .play-btn.playing{ background: var(--accent-1); }

  .play-btn svg{ width: 30px; height:30px; }

  .hint{
    font-size:12px;
    color: var(--text-dim);
    text-align:center;
    max-width: 280px;
    line-height:1.6;
  }

  /* ---- ジャンルプリセット ---- */
  .presets{
    width:100%;
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content:center;
  }

  .preset-btn{
    border: 1px solid #26263a;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
    white-space: nowrap;
  }
  .preset-btn .bpm-num{
    font-variant-numeric: tabular-nums;
    color: var(--text-0);
    margin-left: 4px;
  }
  .preset-btn:hover{
    border-color: var(--accent-2-dim);
  }
  .preset-btn:focus-visible{
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }
  .preset-btn.active{
    border-color: var(--accent-2);
    background: rgba(8, 217, 214, 0.08);
    color: var(--accent-2);
  }
  .preset-btn.active .bpm-num{
    color: var(--accent-2);
  }
</style>
</head>
<body>

  <audio id="keepAlive" loop playsinline preload="auto" src="data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAPAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA"></audio>

  <div class="eyebrow">8カウント メトロノーム</div>

  <div class="stage">
    <div class="ring" id="ring"></div>
    <div class="center">
      <div class="count beat1" id="count">1</div>
      <div class="of-eight">/ 8</div>
    </div>
  </div>

  <div class="controls">
    <div class="bpm-row">
      <div class="bpm-label"><span>TEMPO</span><strong id="bpmValue">120</strong></div>
      <input type="range" id="bpmSlider" min="60" max="200" step="1" value="120" aria-label="BPMを調整">
    </div>

    <div class="presets" id="presets">
      <button class="preset-btn" data-bpm="90">R&B<span class="bpm-num">90</span></button>
      <button class="preset-btn" data-bpm="90">Hip-Hop<span class="bpm-num">90</span></button>
      <button class="preset-btn" data-bpm="120">K-POP<span class="bpm-num">120</span></button>
      <button class="preset-btn" data-bpm="126">House<span class="bpm-num">126</span></button>
      <button class="preset-btn" data-bpm="135">Techno<span class="bpm-num">135</span></button>
      <button class="preset-btn" data-bpm="170">D&B<span class="bpm-num">170</span></button>
    </div>

    <button class="play-btn" id="playBtn" aria-label="再生">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="stopIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>

    <div class="hint">1拍目（ピンクのひし形）が「ワンエイト」の頭。音と色の両方で強調されます。</div>
  </div>

<script>
(() => {
  const RING = document.getElementById('ring');
  const COUNT_EL = document.getElementById('count');
  const BPM_SLIDER = document.getElementById('bpmSlider');
  const BPM_VALUE = document.getElementById('bpmValue');
  const PLAY_BTN = document.getElementById('playBtn');
  const PLAY_ICON = document.getElementById('playIcon');
  const STOP_ICON = document.getElementById('stopIcon');

  const BEATS = 8;
  let bpm = parseInt(BPM_SLIDER.value, 10);

  // ---- 8個のドットを円形に配置 ----
  const dots = [];
  function layoutDots(){
    const size = RING.clientWidth;
    const radius = size / 2 - 10;
    dots.forEach((dot, i) => {
      const angle = (i / BEATS) * 2 * Math.PI - Math.PI / 2; // index0を真上に
      const tx = Math.cos(angle) * radius;
      const ty = Math.sin(angle) * radius;
      dot.style.setProperty('--tx', tx.toFixed(1) + 'px');
      dot.style.setProperty('--ty', ty.toFixed(1) + 'px');
    });
  }

  for (let i = 0; i < BEATS; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' beat1' : '');
    RING.appendChild(d);
    dots.push(d);
  }
  layoutDots();
  window.addEventListener('resize', layoutDots);

  // ---- スライダー見た目の塗り分け ----
  function updateSliderFill(){
    const min = +BPM_SLIDER.min, max = +BPM_SLIDER.max, val = +BPM_SLIDER.value;
    const pct = ((val - min) / (max - min)) * 100;
    BPM_SLIDER.style.setProperty('--pct', pct + '%');
  }
  updateSliderFill();

  const PRESET_BTNS = Array.from(document.querySelectorAll('.preset-btn'));

  function updatePresetActiveState(){
    PRESET_BTNS.forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.bpm, 10) === bpm);
    });
  }

  function setBpm(value){
    bpm = value;
    BPM_SLIDER.value = value;
    BPM_VALUE.textContent = bpm;
    updateSliderFill();
    updatePresetActiveState();
    if (isPlaying) updateMediaSession();
  }

  BPM_SLIDER.addEventListener('input', () => {
    bpm = parseInt(BPM_SLIDER.value, 10);
    BPM_VALUE.textContent = bpm;
    updateSliderFill();
    updatePresetActiveState();
    if (isPlaying) updateMediaSession();
  });

  PRESET_BTNS.forEach(btn => {
    btn.addEventListener('click', () => {
      setBpm(parseInt(btn.dataset.bpm, 10));
    });
  });

  updatePresetActiveState();

  // ---- Web Audio によるスケジューリング（ルックアヘッド方式） ----
  let audioCtx = null;
  let isPlaying = false;
  let currentBeat = 0;      // 0-indexed（0 = 1拍目）
  let nextNoteTime = 0.0;
  let schedulerId = null;
  let noteQueue = [];       // {beat, time} を保持し、視覚更新のタイミングを判定する
  let rafId = null;

  const LOOKAHEAD_MS = 25.0;
  const SCHEDULE_AHEAD_S = 1.0; // バックグラウンドでタイマーが間引かれても音が途切れないよう余裕を持たせる

  function playClick(beat, time){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (beat === 0){
      osc.frequency.setValueAtTime(1400, time);
      gain.gain.setValueAtTime(0.28, time);
    } else {
      osc.frequency.setValueAtTime(880, time);
      gain.gain.setValueAtTime(0.14, time);
    }
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    osc.start(time);
    osc.stop(time + 0.07);
  }

  function scheduleNote(beat, time){
    noteQueue.push({ beat, time });
    playClick(beat, time);
  }

  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD_S){
      scheduleNote(currentBeat, nextNoteTime);
      const secondsPerBeat = 60.0 / bpm;
      nextNoteTime += secondsPerBeat;
      currentBeat = (currentBeat + 1) % BEATS;
    }
    schedulerId = setTimeout(scheduler, LOOKAHEAD_MS);
  }

  function drawLoop(){
    const now = audioCtx.currentTime;
    while (noteQueue.length && noteQueue[0].time <= now){
      const note = noteQueue.shift();
      updateVisual(note.beat);
    }
    rafId = requestAnimationFrame(drawLoop);
  }

  function updateVisual(beat){
    dots.forEach((d, i) => d.classList.toggle('active', i === beat));

    COUNT_EL.textContent = beat + 1;
    COUNT_EL.classList.toggle('beat1', beat === 0);
    COUNT_EL.classList.remove('pulse');
    void COUNT_EL.offsetWidth; // reflow でアニメーションを再トリガー
    COUNT_EL.classList.add('pulse');
  }

  const KEEP_ALIVE = document.getElementById('keepAlive');

  function updateMediaSession(){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `8カウント メトロノーム — ${bpm} BPM`,
      artist: '再生中'
    });
    navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  }

  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', () => start());
    navigator.mediaSession.setActionHandler('pause', () => stop());
    navigator.mediaSession.setActionHandler('stop', () => stop());
  }

  function start(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

    // 無音を鳴らし続け、OSに「メディア再生中」と認識させることで
    // バックグラウンドでのタイマー停止・音声サスペンドを防ぐ
    KEEP_ALIVE.play().catch(() => {});

    currentBeat = 0;
    noteQueue = [];
    nextNoteTime = audioCtx.currentTime + 0.05;
    isPlaying = true;
    scheduler();
    drawLoop();
    updateMediaSession();

    PLAY_BTN.classList.add('playing');
    PLAY_BTN.setAttribute('aria-label', '停止');
    PLAY_ICON.style.display = 'none';
    STOP_ICON.style.display = '';
  }

  function stop(){
    isPlaying = false;
    clearTimeout(schedulerId);
    cancelAnimationFrame(rafId);
    noteQueue = [];
    dots.forEach(d => d.classList.remove('active'));
    COUNT_EL.textContent = '1';
    COUNT_EL.classList.add('beat1');

    KEEP_ALIVE.pause();
    updateMediaSession();

    PLAY_BTN.classList.remove('playing');
    PLAY_BTN.setAttribute('aria-label', '再生');
    PLAY_ICON.style.display = '';
    STOP_ICON.style.display = 'none';
  }

  // タブが非表示の間はrequestAnimationFrameが止まるため見た目の更新は追いつかないが、
  // 音のスケジューリングはAudioContextの時計を基準にしているため精度は保たれる。
  // 復帰時にAudioContextがsuspendされていたら再開する。
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isPlaying && audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  });

  PLAY_BTN.addEventListener('click', () => {
    if (isPlaying) stop(); else start();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space'){
      e.preventDefault();
      if (isPlaying) stop(); else start();
    }
  });
})();
</script>
</body>
</html>
